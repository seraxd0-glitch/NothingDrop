name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip
        run: |
          ZIP="$(ls *.zip | head -n1)"
          echo "Using $ZIP"
          unzip -q "$ZIP" -d src
          DIR="$(dirname "$(find src -name settings.gradle.kts | head -n1)")"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" --title "NothingDrop build ${{ github.run_number }}" --notes "Debug APK"
